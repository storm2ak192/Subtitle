<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مُعدل الترجمة الاحترافي - حجم الخط والألوان</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #f8fafc; }
        .animate-pop { animation: pop 0.3s ease-out; }
        @keyframes pop { 0% { transform: scale(0.95); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        
        #text-preview {
            paint-order: stroke fill;
            text-shadow: none;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
    </style>
</head>
<body class="min-h-screen pb-20">

    <!-- Header -->
    <header class="bg-slate-900 text-white p-6 shadow-xl text-center mb-8 border-b-4 border-indigo-500">
        <h1 class="text-2xl font-bold">مُعدل التوقيت والتنسيق الشامل</h1>
        <p class="text-slate-400 mt-1 text-sm">تعديل الوقت، الألوان، حجم الخط، والحواف بدقة</p>
    </header>

    <main class="max-w-3xl mx-auto px-4">
        
        <!-- Upload Box -->
        <div id="drop-zone" class="bg-white border-2 border-dashed border-indigo-200 rounded-3xl p-8 text-center cursor-pointer hover:bg-indigo-50 transition-all mb-6 shadow-sm">
            <div class="flex flex-col items-center">
                <div class="bg-indigo-100 p-3 rounded-full mb-3">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 13h6m-3-3v6m5 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                    </svg>
                </div>
                <p class="text-lg font-bold text-slate-700">ارفع ملفات الترجمة</p>
                <p class="text-slate-500 text-xs">SRT, VTT, ASS, SSA</p>
            </div>
            <input type="file" id="file-input" class="hidden" multiple accept=".srt,.vtt,.ass,.ssa">
        </div>

        <div id="main-ui" class="hidden space-y-6 animate-pop">
            
            <!-- Live Preview -->
            <div class="bg-slate-800 rounded-3xl p-10 text-center shadow-inner relative overflow-hidden flex items-center justify-center min-h-[160px]">
                <div class="absolute top-2 right-4 text-[10px] text-slate-500 uppercase font-bold tracking-widest">معاينة مباشرة</div>
                <div id="text-preview" class="font-bold">نموذج نص الترجمة الموحد</div>
            </div>

            <!-- Controls Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                
                <!-- Time, Outline & Font Size -->
                <div class="bg-white rounded-3xl p-6 shadow-md space-y-4 border border-slate-100">
                    <h3 class="font-bold text-slate-800 border-b pb-2">التوقيت والتنسيق</h3>
                    
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 mb-1">مقدار الإزاحة (ثواني)</label>
                            <input type="number" id="offset-input" step="0.001" value="0" class="w-full bg-slate-50 border-2 border-slate-100 rounded-xl p-3 text-center font-bold focus:border-indigo-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 mb-1">حجم الخط (Font Size)</label>
                            <input type="number" id="font-size" value="48" class="w-full bg-slate-50 border-2 border-slate-100 rounded-xl p-3 text-center font-bold focus:border-indigo-500 outline-none">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1">حجم الحواف (Outline) من 1 إلى 9</label>
                        <input type="number" id="outline-size" min="1" max="9" value="2" class="w-full bg-slate-50 border-2 border-slate-100 rounded-xl p-3 text-center font-bold focus:border-indigo-500 outline-none">
                    </div>
                </div>

                <!-- Colors -->
                <div class="bg-white rounded-3xl p-6 shadow-md space-y-3 border border-slate-100">
                    <h3 class="font-bold text-slate-800 border-b pb-2">لوحة الألوان</h3>
                    
                    <div class="grid grid-cols-3 gap-2">
                        <div class="text-center">
                            <label class="block text-[10px] font-bold text-slate-500 mb-1">اللون الأساسي</label>
                            <input type="color" id="primary-color" value="#ffffff" class="w-full h-10 rounded-lg cursor-pointer bg-white">
                        </div>
                        <div class="text-center">
                            <label class="block text-[10px] font-bold text-slate-500 mb-1">اللون الثانوي</label>
                            <input type="color" id="secondary-color" value="#ffff00" class="w-full h-10 rounded-lg cursor-pointer bg-white">
                        </div>
                        <div class="text-center">
                            <label class="block text-[10px] font-bold text-slate-500 mb-1">لون الحواف</label>
                            <input type="color" id="outline-color" value="#000000" class="w-full h-10 rounded-lg cursor-pointer bg-white">
                        </div>
                    </div>
                    <p class="text-[10px] text-slate-400 mt-2 leading-relaxed italic">* سيتم تعديل حجم الخط والألوان في كافة الأنماط داخل الملفات.</p>
                </div>
            </div>

            <!-- Apply Button -->
            <button id="apply-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-5 rounded-3xl font-bold text-xl shadow-xl shadow-indigo-200 active:scale-95 transition-all flex items-center justify-center gap-3">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" /></svg>
                تطبيق التعديلات الشاملة
            </button>

            <!-- Files Section -->
            <div class="space-y-4">
                <div class="flex items-center justify-between px-2">
                    <h2 class="font-bold text-slate-700">الملفات الجاهزة:</h2>
                    <button id="download-zip-btn" class="text-sm bg-slate-900 text-white px-4 py-2 rounded-xl font-bold hover:bg-black transition-all flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
                        تحميل الكل (ZIP)
                    </button>
                </div>
                <div id="file-list" class="space-y-3"></div>
            </div>
        </div>

    </main>

    <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-8 py-3 rounded-full text-sm font-bold opacity-0 transition-opacity pointer-events-none z-50 shadow-2xl"></div>

    <script>
        const ui = {
            fileInput: document.getElementById('file-input'),
            dropZone: document.getElementById('drop-zone'),
            mainUi: document.getElementById('main-ui'),
            offsetInput: document.getElementById('offset-input'),
            fontSize: document.getElementById('font-size'),
            outlineSize: document.getElementById('outline-size'),
            primaryColor: document.getElementById('primary-color'),
            secondaryColor: document.getElementById('secondary-color'),
            outlineColor: document.getElementById('outline-color'),
            applyBtn: document.getElementById('apply-btn'),
            fileList: document.getElementById('file-list'),
            zipBtn: document.getElementById('download-zip-btn'),
            toast: document.getElementById('toast'),
            preview: document.getElementById('text-preview')
        };

        let filesData = [];

        function updatePreview() {
            ui.preview.style.color = ui.primaryColor.value;
            ui.preview.style.fontSize = ui.fontSize.value + 'px';
            const size = ui.outlineSize.value;
            const color = ui.outlineColor.value;
            ui.preview.style.webkitTextStroke = `${size}px ${color}`;
        }

        [ui.primaryColor, ui.outlineColor, ui.outlineSize, ui.fontSize].forEach(el => el.oninput = updatePreview);

        ui.dropZone.onclick = () => ui.fileInput.click();
        ui.fileInput.onchange = (e) => handleFiles(e.target.files);

        function handleFiles(files) {
            if (files.length === 0) return;
            Array.from(files).forEach(file => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    filesData.push({
                        name: file.name,
                        content: event.target.result,
                        modified: event.target.result,
                        extension: file.name.split('.').pop().toLowerCase()
                    });
                    renderFiles();
                };
                reader.readAsText(file);
            });
            ui.mainUi.classList.remove('hidden');
            updatePreview();
        }

        function renderFiles() {
            ui.fileList.innerHTML = '';
            filesData.forEach((f, i) => {
                const div = document.createElement('div');
                div.className = 'bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex justify-between items-center animate-pop';
                div.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-indigo-50 rounded-xl flex items-center justify-center text-indigo-600 font-bold text-xs uppercase">${f.extension}</div>
                        <div>
                            <p class="text-slate-700 font-bold text-sm truncate max-w-[200px]">${f.name}</p>
                            <p class="text-[10px] text-slate-400">جاهز للتعديل والتحميل</p>
                        </div>
                    </div>
                    <button onclick="downloadOne(${i})" class="flex items-center gap-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-600 py-2 px-4 rounded-xl transition-all text-xs font-bold">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
                        تحميل
                    </button>`;
                ui.fileList.appendChild(div);
            });
        }

        function hexToAss(hex) {
            const r = hex.substring(1, 3);
            const g = hex.substring(3, 5);
            const b = hex.substring(5, 7);
            return `&H00${b}${g}${r}`;
        }

        ui.applyBtn.onclick = () => {
            const shift = parseFloat(ui.offsetInput.value) || 0;
            const config = {
                primary: hexToAss(ui.primaryColor.value),
                secondary: hexToAss(ui.secondaryColor.value),
                outline: hexToAss(ui.outlineColor.value),
                border: ui.outlineSize.value,
                size: ui.fontSize.value
            };

            filesData = filesData.map(file => ({
                ...file,
                modified: processSubtitle(file.content, shift, file.extension, config)
            }));

            showToast("✅ تم تحديث التوقيت، الألوان، وحجم الخط");
            renderFiles();
        };

        function processSubtitle(text, shift, ext, config) {
            let processed = text;

            // 1. معالجة التوقيت (SRT, VTT, ASS)
            const timestampRegex = /(\d{1,2}:\d{2}:\d{2}[.,]\d{2,3})/g;
            processed = processed.replace(timestampRegex, (match) => {
                const separator = match.includes(',') ? ',' : '.';
                const parts = match.split(/[.,]/);
                const hms = parts[0].split(':');
                const msPart = parts[1];
                let seconds = parseInt(hms[0])*3600 + parseInt(hms[1])*60 + parseInt(hms[2]) + parseFloat("0." + msPart);
                let newSeconds = Math.max(0, seconds + shift);
                const pad = (v, n=2) => v.toString().padStart(n, '0');
                const h = Math.floor(newSeconds / 3600);
                const m = Math.floor((newSeconds % 3600) / 60);
                const s = Math.floor(newSeconds % 60);
                const ms = Math.round((newSeconds % 1) * 1000);
                let finalMs = pad(ms, 3);
                if (msPart.length === 2) finalMs = pad(Math.floor(ms / 10), 2);
                return `${pad(h)}:${pad(m)}:${pad(s)}${separator}${finalMs}`;
            });

            // 2. معالجة التنسيق وحجم الخط (ASS/SSA)
            if (ext === 'ass' || ext === 'ssa') {
                const lines = processed.split(/\r?\n/);
                processed = lines.map(line => {
                    if (line.startsWith('Style:')) {
                        const parts = line.split(',');
                        if (parts.length > 18) {
                            // Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour...
                            parts[2] = config.size;     // Fontsize
                            parts[3] = config.primary;  // Primary
                            parts[4] = config.secondary;// Secondary
                            parts[5] = config.outline;  // Outline
                            parts[16] = config.border;  // Outline Thickness
                            return parts.join(',');
                        }
                    }
                    return line;
                }).join('\n');
            }

            return processed;
        }

        function downloadOne(index) {
            const f = filesData[index];
            triggerDownload(f.modified, f.name);
        }

        ui.zipBtn.onclick = async () => {
            if (filesData.length === 0) return;
            const zip = new JSZip();
            filesData.forEach(f => {
                zip.file(f.name, f.modified);
            });
            const content = await zip.generateAsync({type: "blob"});
            triggerDownload(content, "Subtitles_Edited.zip", true);
        };

        function triggerDownload(content, filename, isBlob = false) {
            const blob = isBlob ? content : new Blob([content], {type: 'text/plain'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = filename;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function showToast(msg) {
            ui.toast.innerText = msg;
            ui.toast.style.opacity = '1';
            setTimeout(() => ui.toast.style.opacity = '0', 3000);
        }
    </script>
</body>
</html>
